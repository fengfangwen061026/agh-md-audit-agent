name: Verify public demo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check_publication.mjs
      - run: node scripts/verify_manifest.mjs
      - run: node scripts/demo.mjs
      - run: node tests/run_local_cases.mjs
